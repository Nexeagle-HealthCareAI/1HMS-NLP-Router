[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "1.0.0"
description = "Framework-driven pre-production testing for AI agents, with a one-page report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pyyaml>=6.0", "reportlab>=4.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-nlp-router"
version = "0.1.0"
description = "Hinglish symptom text -> specialist routing -> emergency flagging (triage support only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0",
    "rapidfuzz>=3.0",
    "indic-transliteration>=2.3",
    "numpy",
    "fastapi",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "fakeredis"]
fasttext = ["fasttext-wheel>=0.9.2; python_version < '3.12'"]
bert = ["transformers", "sentence-transformers"]

[tool.setuptools]
py-modules = ["api"]

[tool.setuptools.packages.find]
include = ["hms_router*"]

[tool.setuptools.package-data]
hms_router = ["data/*.csv"]
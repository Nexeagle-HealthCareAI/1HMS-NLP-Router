# ═══════════════════════════════════════════════════════════════════════════════
# LOCATION API — CI/CD Pipeline  (FastAPI city/pincode/coordinate lookup -> GHCR -> VM)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deployed independently of the NLP Router (deploy-nlp.yml) -- separate image,
# separate container, separate port (5004 vs. 5003) on the SAME dev/prod VMs.
# Path-filtered so a change under location_API/ doesn't touch the NLP router and
# vice versa; each service only rebuilds/redeploys on its own changes.
#
# STAGES:
#   Stage 1 — Build        pip install + import smoke test + location_API's own tests
#   Stage 2 — Docker       build & push image to GHCR
#   Stage 3 — Deploy Dev   pull image -> run on Dev VM  (develop branch, port 5004)
#   Stage 4 — Deploy Prod  pull image -> run on Prod VM (main branch,    port 5004)
#
# Reuses the SAME SSH/GHCR secrets as deploy-nlp.yml (same repo, same VMs):
#   GHCR_TOKEN            GitHub PAT (write:packages + repo)
#   DEV_SSH_HOST / DEV_SSH_USER / DEV_SSH_PASSWORD    Dev VM (151.185.45.77)
#   PROD_SSH_HOST / PROD_SSH_USER / PROD_SSH_KEY_B64  Prod App VM (151.185.45.67)
# ═══════════════════════════════════════════════════════════════════════════════

name: Location API — CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - "location_API/**"
      - ".github/workflows/deploy-location-api.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "location_API/**"
      - ".github/workflows/deploy-location-api.yml"
  workflow_dispatch:

concurrency:
  group: location-api-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/easyhms-location-api

jobs:
# ═══════════════════════════════════════════════════════════════════════════════
  build:
    name: "Stage 1 — Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r location_API/requirements.txt -r requirements-dev.txt

      - name: Import smoke test
        working-directory: location_API
        run: python -c "import main"

      - name: Run location_API test suite
        run: python -m pytest tests/location_API -v

# ═══════════════════════════════════════════════════════════════════════════════
  docker:
    name: "Stage 2 — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: location_API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=location-api
          cache-to: type=gha,mode=max,scope=location-api

# ═══════════════════════════════════════════════════════════════════════════════
  deploy-dev:
    name: "Stage 3 — Deploy → Dev"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: IMAGE,GHCR_TOKEN,ACTOR
          script: |
            set -e
            IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            PULLED=0
            for i in 1 2 3; do
              if docker pull "$IMAGE_LC"; then PULLED=1; break; fi
              echo "docker pull attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PULLED" != 1 ]; then
              echo "docker pull failed after 3 attempts — aborting without touching the running container" >&2
              exit 1
            fi

            docker rm -f location-api-dev 2>/dev/null || true
            docker run -d --name location-api-dev --restart unless-stopped \
              --network host "$IMAGE_LC"
            docker image prune -f || true

      - name: Health check
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                http://${{ secrets.DEV_SSH_HOST }}:5004/health 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ Location API (dev) is up" && exit 0
            sleep 10
          done
          echo "⚠️ Health check inconclusive — check: docker logs location-api-dev"
          exit 0

# ═══════════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: "Stage 4 — Deploy → Prod"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.PROD_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Pull & restart container
        env:
          IMAGE: "${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
              "set -e; \
               echo '$GHCR_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin; \
               PULLED=0; \
               for i in 1 2 3; do \
                 if docker pull '$IMAGE_LC'; then PULLED=1; break; fi; \
                 sleep 5; \
               done; \
               if [ \"\$PULLED\" != 1 ]; then echo 'docker pull failed after 3 attempts, aborting without touching the running container' >&2; exit 1; fi; \
               docker rm -f location-api-prod 2>/dev/null || true; \
               docker run -d --name location-api-prod --restart unless-stopped \
                 --network host '$IMAGE_LC'; \
               docker image prune -f"

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                http://${{ secrets.PROD_SSH_HOST }}:5004/health 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ Location API (prod) is up" && exit 0
            sleep 10
          done
          echo "⚠️ Health check inconclusive — check: docker logs location-api-prod"
          exit 0

      - name: Write summary
        if: always()
        run: |
          echo "## 📍 Location API — Prod" >> $GITHUB_STEP_SUMMARY
          [ "${{ job.status }}" = "success" ] \
            && echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY \
            || echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ needs.docker.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
